<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- first, so the hero preloads below choose their image width for the real phone viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- hero-preload:start -->
    <!-- The home hero's backdrop (forest, ground, banyan): fetched while the loading screen is still starting,
         before the JS has parsed. The loading screen waits for exactly these images (LoadingScreen.jsx). The
         banyan's srcset/sizes match its <img>, so the browser picks the same width once and reuses it.
         Home page only: every route shares this file, and the other pages never show the hero. -->
    <script>
      if (/^\/(index\.html)?$/.test(location.pathname)) {
        [
          { href: '/images/home/hero/background.webp', priority: 'high' },
          { href: '/images/home/hero/banyan.webp', priority: 'high',
            srcset: '/images/home/hero/banyan-600.webp 600w, /images/home/hero/banyan-800.webp 800w, /images/home/hero/banyan-1200.webp 1200w, /images/home/hero/banyan.webp 1534w',
            sizes: '(max-width: 900px) 130vw, min(78vw, 1150px)' },
          { href: '/images/home/hero/ground.webp' },
        ].forEach(function (img) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = img.href;
          if (img.srcset) { l.setAttribute('imagesrcset', img.srcset); l.setAttribute('imagesizes', img.sizes); }
          if (img.priority) l.setAttribute('fetchpriority', img.priority);
          document.head.appendChild(l);
        });
      }
    </script>
    <!-- hero-preload:end -->
    <meta name="theme-color" content="#0d2a18" />
    <!-- Fonts are self-hosted (src/styles/fonts.css). Preload the two faces the first screen paints with. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans.woff2" crossorigin />
    <link rel="dns-prefetch" href="https://wa.me" />
    <!-- per-page SEO (title, description, canonical, social cards, structured data): written by the
         seo-pages plugin in vite.config.js from src/data/routes.js; each built route gets its own copy -->
    <!-- seo:start -->
    <!-- seo:end -->
  </head>
  <body>
    <!-- boot-loader:start -->
    <!-- Home page loading screen. Painted from this HTML, before any JavaScript has downloaded, so the branded
         intro shows immediately even on a slow connection while the hero images (preloaded above) download in
         parallel. The intro animation is plain CSS, with the same timings and easing as before. LoadingScreen.jsx
         (in the app bundle) attaches to it and starts the exit only once the hero's backdrop images have loaded
         and decoded and the intro has played through: event-driven, no timers. Home page only. -->
    <script>
      if (/^\/(index\.html)?$/.test(location.pathname)) (function () {
        var LEAF = 'M0 0 C 7 -11, 22 -15, 28 -2 C 22 9, 7 11, 0 0 Z', VEIN = 'M1 0 C 9 -3, 17 -4, 25 -2';
        // small leaves around the logo: x %, y %, size px, rotation deg
        var floaters = [[18, 26, 26, -20], [80, 22, 22, 35], [12, 66, 20, 10], [86, 62, 28, -40], [30, 84, 18, 25], [70, 86, 22, -15]]
          .map(function (f, i) {
            return '<span class="ls-floater" style="left:' + f[0] + '%;top:' + f[1] + '%;--i:' + i + '"><i class="ls-bob">'
              + '<svg width="' + f[2] + '" height="' + f[2] * 0.8 + '" viewBox="-2 -16 32 32" style="transform:rotate(' + f[3] + 'deg)">'
              + '<path d="' + LEAF + '" fill="#79A66A" stroke="#174D35" stroke-width="0.5"/>'
              + '<path d="' + VEIN + '" fill="none" stroke="#DCE8D3" stroke-width="0.7" stroke-linecap="round"/></svg></i></span>';
          }).join('');
        var css = ''
          // the previous GSAP eases as CSS curves: power3.out, power2.inOut, back.out(1.6), sine.inOut, power2.in
          + ':root{--ls-p3o:cubic-bezier(.215,.61,.355,1);--ls-p2io:cubic-bezier(.455,.03,.515,.955);--ls-back:cubic-bezier(.34,1.56,.64,1);--ls-sine:cubic-bezier(.37,0,.63,1);--ls-p2i:cubic-bezier(.55,.085,.68,.53)}'
          + '#boot-loader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;color:#174D35;'
          + 'background:radial-gradient(ellipse at 50% 40%,rgba(220,232,211,.55),transparent 60%),#F7F8EF;animation:ls-fade .6s cubic-bezier(.25,.46,.45,.94) backwards}'
          + '.ls-stage{position:relative;width:min(92vw,520px);height:min(70vh,520px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem}'
          + '.ls-logo-wrap{position:relative;display:grid;place-items:center}'
          + '.ls-logo{width:clamp(140px,36vw,200px);height:auto;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(220,232,211,.8),0 18px 40px -18px rgba(23,77,53,.35);animation:ls-logo 1.1s var(--ls-p3o) .25s backwards}'
          + '.ls-seedling{margin-top:.4rem;overflow:visible}'
          + '.ls-stem{stroke-dasharray:60;animation:ls-stem .9s var(--ls-p2io) .7s backwards}'
          + '.ls-leaf-l,.ls-leaf-r{transform-box:fill-box}'
          + '.ls-leaf-l{transform-origin:100% 100%;animation:ls-leaf-l .9s var(--ls-back) 1.25s backwards}'
          + '.ls-leaf-r{transform-origin:0 100%;animation:ls-leaf-r .9s var(--ls-back) 1.4s backwards}'
          + '.ls-floater{position:absolute;line-height:0;pointer-events:none;animation:ls-rise 1s var(--ls-p3o) calc(1s + var(--i) * .08s) backwards}'
          + '.ls-bob{display:block;animation:ls-bob calc(3.2s + var(--i) * .35s) var(--ls-sine) calc(1.6s + var(--i) * .2s) infinite alternate}'
          + '.ls-floater:nth-child(even) .ls-bob{animation-name:ls-bob-r}'
          + '.ls-caption{margin:.2rem 0 0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.05rem,2.4vw,1.35rem);font-style:italic;letter-spacing:.01em;color:#174D35;animation:ls-rise-s .8s var(--ls-p3o) 1.3s backwards}'
          + '.ls-rail{position:relative;width:min(60vw,220px);height:2px;border-radius:2px;background:#DCE8D3;overflow:hidden;animation:ls-fade .6s var(--ls-p3o) 1.5s backwards}'
          + '.ls-rail-fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(.04);background:linear-gradient(90deg,#79A66A,#174D35);transition:transform .45s cubic-bezier(.2,.8,.2,1)}'
          // the exit (LoadingScreen.jsx adds the class): leaves lift away, caption and rail fade, the stage swells
          // slightly and the whole screen dissolves into the hero
          + '#boot-loader.is-exiting{opacity:0;transition:opacity .8s var(--ls-p2io) .35s}'
          + '#boot-loader.is-exiting .ls-stage{transform:scale(1.06);transition:transform .9s var(--ls-p2io) .1s}'
          + '#boot-loader.is-exiting .ls-floater{opacity:0;transform:translateY(-10px);transition:opacity .5s var(--ls-p2i) calc(var(--i) * .04s),transform .5s var(--ls-p2i) calc(var(--i) * .04s)}'
          + '#boot-loader.is-exiting .ls-caption,#boot-loader.is-exiting .ls-rail{opacity:0;transform:translateY(-6px);transition:opacity .45s var(--ls-p2i),transform .45s var(--ls-p2i)}'
          + '@keyframes ls-fade{from{opacity:0}}'
          + '@keyframes ls-logo{from{opacity:0;transform:scale(.86)}}'
          + '@keyframes ls-stem{from{stroke-dashoffset:60}}'
          + '@keyframes ls-leaf-l{from{transform:scale(0) rotate(-40deg)}}'
          + '@keyframes ls-leaf-r{from{transform:scale(0) rotate(40deg)}}'
          + '@keyframes ls-rise{from{opacity:0;transform:translateY(16px)}}'
          + '@keyframes ls-rise-s{from{opacity:0;transform:translateY(10px)}}'
          + '@keyframes ls-bob{to{transform:translateY(8px) rotate(-6deg)}}'
          + '@keyframes ls-bob-r{to{transform:translateY(11px) rotate(6deg)}}'
          + '@media (max-width:600px){.ls-stage{height:min(62vh,460px)}.ls-floater:nth-child(5),.ls-floater:nth-child(6){display:none}}'
          + '@media (prefers-reduced-motion:reduce){#boot-loader,#boot-loader *{animation:none!important;transition:none!important}}';
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
        var el = document.createElement('div');
        el.id = 'boot-loader';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        el.setAttribute('aria-label', 'Loading');
        el.innerHTML = '<div class="ls-stage">' + floaters
          + '<div class="ls-logo-wrap"><img class="ls-logo" src="/images/brand/logo-256.webp" alt="Sri Ayyappa Bala Sai Nursery" width="256" height="256" fetchpriority="high">'
          + '<svg class="ls-seedling" viewBox="0 0 80 60" width="80" height="60" aria-hidden="true">'
          + '<path class="ls-stem" d="M40 58 C 40 46, 38 36, 40 22" fill="none" stroke="#174D35" stroke-width="2.4" stroke-linecap="round"/>'
          + '<path class="ls-leaf-l" d="M40 30 C 30 30, 20 24, 18 14 C 28 14, 38 20, 40 30 Z" fill="#79A66A" stroke="#174D35" stroke-width="0.8"/>'
          + '<path class="ls-leaf-r" d="M40 24 C 50 24, 60 18, 62 8 C 52 8, 42 14, 40 24 Z" fill="#79A66A" stroke="#174D35" stroke-width="0.8"/>'
          + '<path d="M28 59 Q40 55 52 59" fill="none" stroke="#DCE8D3" stroke-width="3" stroke-linecap="round"/></svg></div>'
          + '<p class="ls-caption">Growing Your Experience…</p>'
          + '<div class="ls-rail" aria-hidden="true"><span class="ls-rail-fill"></span></div></div>';
        document.body.appendChild(el);
        document.documentElement.style.overflow = 'hidden'; // the page under the overlay does not scroll yet
        document.documentElement.dataset.heroLoad = 'loading';
        // never trap the visitor: if the app's own scripts fail to load, or the app fails before it takes over
        // the screen, step aside (event-driven, no timer). Normally LoadingScreen.jsx removes the screen itself.
        function release(e) {
          if (!el.isConnected || document.documentElement.dataset.heroLoad === 'exiting') return;
          console.error('[SABSN] The page failed to start; showing it without the loading screen.', e && (e.message || e.reason || (e.target && e.target.src)));
          el.remove();
          document.documentElement.style.overflow = '';
          document.documentElement.dataset.heroLoad = 'error-fallback';
        }
        window.addEventListener('error', function (e) {
          if ((e.target && e.target.tagName === 'SCRIPT') || (e instanceof ErrorEvent && !/ResizeObserver/.test(e.message))) release(e);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (/dynamically imported module|Importing a module script failed|error loading dynamically imported/i.test(String(e.reason && e.reason.message))) release(e);
        });
      })();
    </script>
    <!-- boot-loader:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
